<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你的名字 · Terra → Luna</title>
<meta name="description" content="你的名字的个人网站。一句话介绍自己：我是谁，在做什么，在意什么。">
<meta property="og:type" content="website">
<meta property="og:title" content="你的名字 · Terra → Luna">
<meta property="og:description" content="你的名字的个人网站。一句话介绍自己：我是谁，在做什么，在意什么。">
<meta name="theme-color" content="#02030a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="lib/site.css">
<style>
  html, body { height: auto; }
  body { overflow-x: clip; overflow-y: auto; }
  canvas#space { pointer-events: none; }
  #voyage { position: relative; z-index: 1; }

  /* 导航：左边一枚玻璃圆片 + 名字，右边一条玻璃药丸 */
  .top { position: fixed; z-index: 6; top: 0; left: 0; right: 0; padding: 22px clamp(18px, 3.4vw, 48px); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .mark { display: flex; align-items: center; gap: 12px; font-size: 14px; letter-spacing: .14em; }
  .mark .disc { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .top nav { display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px; }
  .top nav a, .top nav button { height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; font-size: 13px; letter-spacing: .06em; color: var(--dim); transition: color .25s, background .25s; }
  .top nav a:hover, .top nav button:hover { color: var(--ink); background: rgba(255, 255, 255, .07); }
  .top nav .sep { width: 1px; height: 16px; background: var(--line); }

  /* 首屏：地平线压在下方，文字居中站在上方的太空里 */
  .leg { min-height: 150vh; display: grid; align-items: center; padding: 0 clamp(18px, 5.5vw, 84px); }
  .leg.right { justify-items: end; } .leg.left { justify-items: start; }
  .leg.hero { min-height: 100vh; min-height: 100svh; place-items: center; padding: 0 20px 24vh; text-align: center; }
  .hero-inner { display: grid; justify-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 10px; padding: 4px 16px 4px 4px; border-radius: 999px; font-size: 13px; color: rgba(242, 244, 248, .86); }
  .badge b { padding: 5px 11px; border-radius: 999px; background: #f2f4f8; color: #05060c; font: italic 400 15px/1 "Instrument Serif", serif; letter-spacing: .02em; }
  .hero h1 { font-size: clamp(64px, 10.5vw, 152px); line-height: .95; margin: 26px 0 22px; text-shadow: 0 16px 38px rgba(0, 0, 0, .35); }
  .hero .lede { font-size: clamp(15px, 1.25vw, 17.5px); line-height: 1.8; color: var(--dim); max-width: 31em; text-wrap: balance; text-shadow: 0 2px 18px rgba(0, 0, 0, .5); }
  .ctas { display: flex; align-items: center; gap: 26px; margin-top: 34px; }

  /* 航程面板 */
  .panel { width: min(520px, 42vw); border-radius: 28px; background: rgba(6, 8, 16, .66); opacity: 0; transform: translateY(46px); transition: opacity .9s var(--ease), transform 1.1s var(--ease); }
  .leg.in .panel { opacity: 1; transform: none; }
  .panel .sheet-head .eyebrow { display: none; }
  .panel .sheet-head { padding-top: 6px; } .panel .sheet-head h2 { margin-top: 8px; }
  .legno { display: flex; align-items: center; gap: 12px; padding: 28px 34px 0; font-size: 11px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--faint); }
  .legno .n { font: italic 400 20px/1 "Instrument Serif", serif; letter-spacing: 0; color: var(--ink); }
  .legno i { width: 28px; height: 1px; background: var(--faint); }
  .legno em { margin-left: auto; font-style: normal; }

  /* 底部读数：离地球多远、离月球多远 */
  .hud { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 28px; padding: 0 clamp(18px, 3.4vw, 48px) 26px; pointer-events: none; text-shadow: 0 1px 14px rgba(0, 0, 0, .9); }
  .hud .label { display: block; margin-bottom: 6px; }
  .hud .num { font-size: 34px; line-height: .9; }
  .hud em { font: 400 12px/1 var(--sans); color: var(--faint); margin-left: 6px; letter-spacing: .08em; }
  .hud .r { text-align: right; }
  .hud .bar { height: 1px; background: var(--line); position: relative; margin-bottom: 9px; }
  .hud .bar i { position: absolute; left: 0; top: -.5px; height: 2px; width: 100%; transform-origin: left; transform: scaleX(0); background: var(--accent-grad); }
  .hud .bar b { position: absolute; top: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #f2f4f8; box-shadow: 0 0 12px var(--accent); }

  .rail { position: fixed; z-index: 5; right: clamp(10px, 1.6vw, 22px); top: 50%; transform: translateY(-50%); display: grid; gap: 2px; }
  .rail button { display: flex; flex-direction: row-reverse; align-items: center; gap: 10px; padding: 7px 0 7px 12px; font-size: 12px; letter-spacing: .12em; color: var(--dim); text-shadow: 0 1px 10px #000; }
  .rail i { width: 12px; height: 1px; background: var(--faint); transition: width .4s var(--ease), background .4s; }
  .rail span { opacity: 0; transform: translateX(6px); transition: opacity .3s, transform .3s var(--ease); white-space: nowrap; }
  .rail button:hover span, .rail button:focus-visible span { opacity: 1; transform: none; }
  .rail button.on i { width: 26px; background: var(--ink); }

  .pin { position: fixed; z-index: 2; left: 0; top: 0; font-size: 12px; letter-spacing: .16em; color: var(--gold); white-space: nowrap; opacity: 0; transition: opacity .5s; pointer-events: none; text-shadow: 0 1px 8px #000; }
  .pin.on { opacity: 1; }
  .pin::before { content: ""; display: inline-block; width: 22px; height: 1px; background: var(--gold); vertical-align: middle; margin-right: 8px; opacity: .7; }

  /* 加载页：发射倒计时 10 → 0 */
  .loader { position: fixed; inset: 0; z-index: 9; background: var(--bg); display: grid; place-items: center; align-content: center; gap: 26px; transition: opacity .9s var(--ease) .1s, visibility 0s 1s; }
  .loader .count { font-size: clamp(120px, 22vw, 260px); line-height: .8; min-width: 1.2em; text-align: center; transition: transform .9s var(--ease), filter .9s; }
  .loader .track { width: 180px; height: 1px; background: var(--line); }
  .loader .track i { display: block; height: 100%; background: var(--accent-grad); transform-origin: left; transform: scaleX(0); }
  body.ready .loader { opacity: 0; visibility: hidden; }
  body.ready .loader .count { transform: scale(1.08); filter: blur(8px); }

  @media (max-width: 760px) {
    .top { padding: 14px 16px; } .mark .disc { width: 40px; height: 40px; } .mark span { display: none; }
    .leg { min-height: 170vh; padding: 0 12px; }
    .leg.hero { padding: 0 24px 34vh; }
    .hero .lede { max-width: 18em; }
    .hero h1 { margin: 22px 0 18px; }
    .ctas { flex-direction: column; gap: 18px; margin-top: 28px; }
    .panel { width: 100%; }
    .legno { padding: 22px 22px 0; }
    .rail { display: none; }
    .hud { gap: 14px; padding: 34px 16px 14px; background: linear-gradient(to top, rgba(3, 3, 8, .95) 40%, transparent); }
    .hud .num { font-size: 24px; } .hud .label { font-size: 9.5px; letter-spacing: .2em; }
  }
</style>
</head>
<body>
<canvas id="space"></canvas>

<header class="top">
  <a class="mark appear appear--down" style="--d:.06s" href="#top"><span class="disc glass glass--thin" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="4.2" fill="#dbe7f5"/><ellipse cx="11" cy="11" rx="9.6" ry="3.6" stroke="#dbe7f5" stroke-opacity=".55" transform="rotate(-24 11 11)"/></svg>
  </span><span id="mark-name"></span></a>
  <nav class="glass glass--thin appear appear--down" style="--d:.14s"><button id="lang" type="button"></button><span class="sep"></span><a href="system.html" id="hub"></a></nav>
</header>

<main id="voyage"></main>
<div class="pin" id="pin"></div>
<nav class="rail appear appear--fade" style="--d:1.3s" id="rail" aria-label="航线"></nav>
<aside class="hud appear appear--fade" style="--d:1.25s" aria-hidden="true">
  <div><span class="label" id="h-la"></span><b class="num" id="h-from">0</b><em>km</em></div>
  <div class="bar"><i id="h-bar"></i><b id="h-dot"></b></div>
  <div class="r"><span class="label" id="h-lb"></span><b class="num" id="h-to">384,400</b><em>km</em></div>
</aside>

<div class="loader" aria-hidden="true">
  <span class="label">T-minus</span>
  <b class="count num" id="count">10</b>
  <span class="track"><i id="l-bar"></i></span>
  <span class="label" id="loading"></span>
</div>
<script type="module" src="b.js"></script>
</body>
</html>
