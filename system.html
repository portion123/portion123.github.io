<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的名字 · 个人星系</title>
<meta name="description" content="你的名字的个人网站。一句话介绍自己：我是谁，在做什么，在意什么。">
<meta property="og:type" content="website">
<meta property="og:title" content="你的名字 · 个人星系">
<meta property="og:description" content="你的名字的个人网站。一句话介绍自己：我是谁，在做什么，在意什么。">
<meta name="theme-color" content="#02030a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="lib/site.css">
<style>
  .top { position: fixed; z-index: 5; top: 0; left: 0; right: 0; padding: 22px 28px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .top a { pointer-events: auto; }
  .mark { display: flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: .2em; }
  .mark i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #ffd28a 45%, #ff8a2a); box-shadow: 0 0 18px #ffb45a; }
  .top nav { display: flex; gap: 8px; }
  .top nav a, .top nav button { pointer-events: auto; font-family: var(--tech); font-size: 12px; letter-spacing: .2em; color: var(--dim); padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; }
  .top nav a:hover, .top nav button:hover { color: var(--ink); border-color: rgba(255, 255, 255, .4); }

  .hero { position: fixed; z-index: 3; left: clamp(22px, 6vw, 96px); bottom: 128px; max-width: 560px; pointer-events: none; transition: opacity .7s, transform .9s cubic-bezier(.2, .8, .2, 1); }
  .hero h1 { font-size: clamp(46px, 7.2vw, 104px); font-weight: 200; letter-spacing: .1em; line-height: 1.1; margin: 18px 0 16px; text-shadow: 0 0 60px rgba(120, 160, 255, .25); }
  .hero .tagline { font-size: clamp(15px, 1.3vw, 18px); line-height: 1.9; color: var(--dim); max-width: 26em; }
  .hero .hint { margin-top: 22px; font-size: 13px; letter-spacing: .14em; color: var(--faint); }
  body.focus .hero { opacity: 0; transform: translateY(16px); }

  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; padding: 6px 10px 6px 0; opacity: 0; transition: opacity .5s; will-change: transform; }
  .label.on { opacity: 1; pointer-events: auto; }
  .label::before { content: ""; width: 16px; height: 1px; background: var(--tint); opacity: .7; align-self: center; }
  .label { text-shadow: 0 1px 10px rgba(0, 0, 0, .95), 0 0 3px rgba(0, 0, 0, .8); }
  .label b { font-weight: 500; font-size: 14px; letter-spacing: .12em; }
  .label span { font-family: var(--tech); font-size: 11px; letter-spacing: .2em; color: var(--faint); }
  .label:hover b { color: var(--tint); }

  .dock { position: fixed; z-index: 4; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: calc(100vw - 24px); display: flex; gap: 2px; padding: 7px; border-radius: 999px; overflow-x: auto; scrollbar-width: none; transition: left .9s cubic-bezier(.2, .8, .2, 1); }
  .dock::-webkit-scrollbar { display: none; }
  .dock button { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; font-size: 13.5px; letter-spacing: .08em; color: var(--dim); white-space: nowrap; transition: background .3s, color .3s; }
  .dock button:hover, .dock button.on { background: rgba(255, 255, 255, .1); color: var(--ink); }
  .dock .dot { width: 7px; height: 7px; }
  body.focus .dock { left: calc((100vw - min(560px, 44vw) - 18px) / 2); max-width: calc(100vw - min(560px, 44vw) - 60px); }

  .sheet { position: fixed; z-index: 6; top: 18px; right: 18px; bottom: 18px; width: min(560px, 44vw); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(calc(100% + 40px)); transition: transform .95s cubic-bezier(.2, .8, .2, 1); }
  body.focus .sheet { transform: none; }
  .sheet .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 0; }
  .sheet .bar button { font-size: 13px; letter-spacing: .12em; color: var(--dim); padding: 8px 12px; border-radius: 999px; }
  .sheet .bar button:hover { color: var(--ink); background: rgba(255, 255, 255, .08); }
  .sheet .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; }
  .pager { display: flex; border-top: 1px solid var(--line); }
  .pager button { flex: 1; padding: 16px 20px; text-align: left; display: grid; gap: 3px; transition: background .3s; }
  .pager button + button { text-align: right; border-left: 1px solid var(--line); }
  .pager button:hover { background: rgba(255, 255, 255, .06); }
  .pager small { font-family: var(--tech); font-size: 11px; letter-spacing: .2em; color: var(--faint); }

  .loader { position: fixed; inset: 0; z-index: 9; background: var(--bg); display: grid; place-items: center; align-content: center; gap: 18px; transition: opacity 1.2s .2s, visibility 0s 1.4s; font-size: 13px; letter-spacing: .3em; color: var(--dim); }
  .loader i { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); border-top-color: var(--gold); animation: spin 1.1s linear infinite; }
  body.ready .loader { opacity: 0; visibility: hidden; }
  @keyframes spin { to { transform: rotate(1turn); } }

  @media (max-width: 760px) {
    .top { padding: 16px 18px; }
    .hero { left: 22px; right: 22px; bottom: auto; top: 76px; }
    .hero h1 { margin: 12px 0 10px; }
    .hero .hint { display: none; }
    .dock { left: 12px; right: 12px; bottom: 14px; transform: none; max-width: none; border-radius: 22px; }
    body.focus .dock { left: 12px; max-width: none; opacity: 0; pointer-events: none; }
    .sheet { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 62vh; border-radius: 24px; transform: translateY(calc(100% + 30px)); }
  }
</style>
</head>
<body>
<canvas id="space"></canvas>

<header class="top">
  <a class="mark" href="#home"><i></i><span id="mark-name"></span></a>
  <nav><button id="lang" type="button"></button><a href="index.html" id="hub"></a></nav>
</header>

<section class="hero">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="name"></h1>
  <p class="tagline" id="tagline"></p>
  <p class="hint" id="hint"></p>
</section>

<div id="labels"></div>
<nav class="dock glass" id="dock" aria-label="栏目"></nav>

<aside class="sheet glass" id="sheet" aria-hidden="true">
  <div class="bar"><button id="back"></button></div>
  <div class="scroll" id="content"></div>
  <footer class="pager"><button id="prev"></button><button id="next"></button></footer>
</aside>

<div class="loader"><i></i><span id="loading"></span></div>
<script type="module" src="a.js"></script>
</body>
</html>
