<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的名字 · 个人星系</title>
<meta name="description" content="你的名字的个人网站。一句话介绍自己：我是谁，在做什么，在意什么。">
<meta property="og:type" content="website">
<meta property="og:title" content="你的名字 · 个人星系">
<meta property="og:description" content="你的名字的个人网站。一句话介绍自己：我是谁，在做什么，在意什么。">
<meta name="theme-color" content="#02030a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="lib/site.css">
<style>
  .top { position: fixed; z-index: 7; top: 0; left: 0; right: 0; padding: 22px clamp(18px, 3.4vw, 48px); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .mark { display: flex; align-items: center; gap: 12px; font-size: 14px; letter-spacing: .14em; }
  .mark .disc { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .top nav { display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px; }
  .top nav a, .top nav button { height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; font-size: 13px; letter-spacing: .06em; color: var(--dim); transition: color .25s, background .25s; }
  .top nav a:hover, .top nav button:hover { color: var(--ink); background: rgba(255, 255, 255, .07); }
  .top nav .sep { width: 1px; height: 16px; background: var(--line); }

  .hero { position: fixed; z-index: 3; left: clamp(22px, 6vw, 96px); bottom: 128px; max-width: 560px; pointer-events: none; transition: opacity .7s, transform .9s cubic-bezier(.2, .8, .2, 1); }
  .hero h1 { font-size: clamp(60px, 8.6vw, 128px); line-height: .95; margin: 20px 0 20px; text-shadow: 0 16px 38px rgba(0, 0, 0, .35); }
  .hero .tagline { font-size: clamp(15px, 1.25vw, 17.5px); line-height: 1.8; color: var(--dim); max-width: 27em; text-wrap: balance; text-shadow: 0 2px 18px rgba(0, 0, 0, .6); }
  .hero .hint { margin-top: 26px; }
  body.focus .hero { opacity: 0; transform: translateY(16px); }

  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .plabel { position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; padding: 6px 10px 6px 0; opacity: 0; transition: opacity .5s; will-change: transform; }
  .plabel.on { opacity: 1; pointer-events: auto; }
  .plabel::before { content: ""; width: 16px; height: 1px; background: var(--tint); opacity: .7; align-self: center; }
  .plabel { text-shadow: 0 1px 10px rgba(0, 0, 0, .95), 0 0 3px rgba(0, 0, 0, .8); }
  .plabel b { font-weight: 500; font-size: 14px; letter-spacing: .12em; }
  .plabel span { font-family: var(--tech); font-size: 11px; letter-spacing: .2em; color: var(--faint); }
  .plabel:hover b { color: var(--tint); }

  .dock { position: fixed; z-index: 4; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: calc(100vw - 24px); display: flex; gap: 2px; padding: 7px; border-radius: 999px; overflow-x: auto; scrollbar-width: none; transition: left .9s cubic-bezier(.2, .8, .2, 1); }
  .dock { opacity: 0; transition: left .9s var(--ease), opacity .8s 1.1s; } body.ready .dock { opacity: 1; }
  .dock::-webkit-scrollbar { display: none; }
  .dock button { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; font-size: 13.5px; letter-spacing: .08em; color: var(--dim); white-space: nowrap; transition: background .3s, color .3s; }
  .dock button:hover, .dock button.on { background: rgba(255, 255, 255, .1); color: var(--ink); }
  .dock .dot { width: 7px; height: 7px; }
  body.focus .dock { left: calc((100vw - min(560px, 44vw) - 18px) / 2); max-width: calc(100vw - min(560px, 44vw) - 60px); }

  .sheet { position: fixed; z-index: 6; top: 84px; right: 18px; bottom: 18px; width: min(560px, 44vw); border-radius: 28px; background: rgba(6, 8, 16, .66); display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(calc(100% + 40px)); transition: transform .95s cubic-bezier(.2, .8, .2, 1); }
  body.focus .sheet { transform: none; }
  .sheet .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 0; }
  .sheet .bar button { font-size: 13px; letter-spacing: .12em; color: var(--dim); padding: 8px 12px; border-radius: 999px; }
  .sheet .bar button:hover { color: var(--ink); background: rgba(255, 255, 255, .08); }
  .sheet .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; }
  .pager { display: flex; border-top: 1px solid var(--line); }
  .pager button { flex: 1; padding: 16px 20px; text-align: left; display: grid; gap: 3px; transition: background .3s; }
  .pager button + button { text-align: right; border-left: 1px solid var(--line); }
  .pager button:hover { background: rgba(255, 255, 255, .06); }
  .pager small { font-size: 11px; letter-spacing: .2em; color: var(--faint); }

  .loader { position: fixed; inset: 0; z-index: 9; background: var(--bg); display: grid; place-items: center; align-content: center; gap: 26px; transition: opacity .9s var(--ease) .1s, visibility 0s 1s; }
  .loader .count { font-size: clamp(120px, 22vw, 260px); line-height: .8; min-width: 1.2em; text-align: center; transition: transform .9s var(--ease), filter .9s; }
  .loader .track { width: 180px; height: 1px; background: var(--line); }
  .loader .track i { display: block; height: 100%; background: linear-gradient(90deg, #f3d28f, #e08a3c); transform-origin: left; transform: scaleX(0); }
  body.ready .loader { opacity: 0; visibility: hidden; }
  body.ready .loader .count { transform: scale(1.08); filter: blur(8px); }

  #space { cursor: grab; }
  .top nav a, .top nav button, .dock button, .sheet .bar button, .mark { min-height: 44px; min-width: 44px; }
  .plabel { min-height: 44px; align-items: center; color: var(--dim); }
  .plabel::before { transition: width .25s var(--ease); }
  .plabel b { transition: color .25s; }
  .plabel span { opacity: .65; transition: opacity .25s; }
  .plabel.hot b, .plabel:hover b { color: var(--ink); }
  .plabel.hot::before, .plabel:hover::before { width: 26px; }
  .plabel.hot span, .plabel:hover span { opacity: 1; }
  .dock button.hot { background: rgba(255, 255, 255, .1); color: var(--ink); }
  .dock button { flex-shrink: 0; }
  #time-boost { position: fixed; z-index: 3; top: 0; left: 0; display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; color: var(--gold); font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #time-boost.on { opacity: 1; }
  #time-boost .num { font-size: 24px; min-width: 2ch; }
  .hero .hint { line-height: 1.9; letter-spacing: .12em; text-transform: none; max-width: 46em; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 760px) {
    .top { padding: 14px 16px; } .mark .disc { width: 40px; height: 40px; } .mark span { display: none; }
    .hero { left: 22px; right: 22px; bottom: auto; top: 76px; }
    .hero h1 { margin: 12px 0 10px; }
    .hero .hint { display: block; margin-top: 12px; font-size: 10px; letter-spacing: .04em; max-width: 32em; }
    .dock { left: 12px; right: 12px; bottom: 14px; transform: none; max-width: none; border-radius: 22px; }
    body.focus .dock { left: 12px; max-width: none; opacity: 0; pointer-events: none; }
    .sheet { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 62vh; border-radius: 24px; transform: translateY(calc(100% + 30px)); }
  }
</style>
</head>
<body>
<canvas id="space"></canvas>

<header class="top">
  <a class="mark appear appear--down" style="--d:.06s" href="#home"><span class="disc glass glass--thin" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="4.6" fill="#f3d28f"/><circle cx="11" cy="11" r="8.6" stroke="#f3d28f" stroke-opacity=".4" stroke-dasharray="1.5 2.6"/></svg>
  </span><span id="mark-name"></span></a>
  <nav class="glass glass--thin appear appear--down" style="--d:.14s"><button id="lang" type="button"></button><span class="sep"></span><a href="index.html" id="hub"></a></nav>
</header>

<section class="hero">
  <p class="eyebrow appear appear--soft" style="--d:.22s" id="eyebrow"></p>
  <h1 class="display" id="name"></h1>
  <p class="tagline appear appear--soft" style="--d:.95s;animation-duration:1.25s" id="tagline"></p>
  <p class="hint label appear appear--fade" style="--d:1.2s" id="hint"></p>
</section>

<div id="labels"></div>
<div id="time-boost" class="glass glass--thin" aria-hidden="true"><span id="time-word"></span><span>×<b class="num" id="time-multiplier">1</b></span></div>
<nav class="dock glass" id="dock" aria-label="栏目"></nav>

<aside class="sheet glass" id="sheet" aria-hidden="true">
  <div class="bar"><button id="back"></button></div>
  <div class="scroll" id="content"></div>
  <footer class="pager"><button id="prev"></button><button id="next"></button></footer>
</aside>

<div class="loader" aria-hidden="true">
  <span class="label">T-minus</span>
  <b class="count num" id="count">10</b>
  <span class="track"><i id="l-bar"></i></span>
  <span class="label" id="loading"></span>
</div>
<script type="module" src="a.js"></script>
</body>
</html>
